# The showcase site's Nginx site on the server (/etc/nginx/sites-available/eu.atom-forge.brickee).
# TLS: the *.atom-forge.eu wildcard certificate.
server {
    listen 80;
    server_name brickee.atom-forge.eu;
    return 301 https://brickee.atom-forge.eu$request_uri;
}

server {
    listen 443 ssl;
    server_name brickee.atom-forge.eu;

    ssl_certificate     /etc/letsencrypt/live/atom-forge.eu/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/atom-forge.eu/privkey.pem;

    root /var/www/eu.atom-forge.brickee/current;
    index index.html;

    location / {
        # Directory routes resolve to their own index.html. Missing routes are 404.
        try_files $uri $uri.html $uri/ =404;
    }

    gzip on;
    gzip_static on;
    gzip_types text/css application/javascript image/svg+xml application/json;
}
